name: 14 - Working with Artifacts
on:
  workflow_dispatch:
env:
  build-artifact-key: app-${{ github.sha }}
  test-coverage-key: test-coverage-${{ github.sha }}
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-using-actions/udemygithubcourse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Download cached Dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: 04-using-actions/udemygithubcourse/node_modules
          key: deps-node-modules-${{ hashFiles('04-using-actions/udemygithubcourse/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Unit tests
        run: npm run test -- --coverage
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.test-coverage-key }}
          path: 04-using-actions/udemygithubcourse/coverage
      - name: Build code
        run: npm run build
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.build-artifact-key }}
          path: 04-using-actions/udemygithubcourse/build
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.build-artifact-key }}
          path: build
      - name: Show folder structure
        run: ls -R
        
