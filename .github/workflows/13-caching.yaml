name: 13 - Using Caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache step
        type: boolean
        default: true
      node-version:
        description: Node Version
        type: choice
        options:
          - 18.x
          - 20.x
          - 21.x
        default: 20.x
        
# 1. Checkout the code
# 2. Install dependencies
# 3. Linting, formatting, unit testing, building
# 4. Deploy to a nonprod
jobs:
  install-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-using-actions/udemygithubcourse
    outputs:
      deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Calculate cache key
        id: cache-key
        run: |
          echo "CACHE_KEY=deps-node-modules-${{ hashFiles('04-using-actions/udemygithubcourse/package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Download cached Dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v3
        with:
          path: 04-using-actions/udemygithubcourse/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
  lint-test:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: 04-using-actions/udemygithubcourse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download cached Dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v3
        with:
          path: 04-using-actions/udemygithubcourse/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}
      - name: Testing
        run: npm run test
      - name: Linting
        run: echo "Linting..."

  build:
    runs-on: ubuntu-latest
    needs: install-deps
    defaults:
      run:
        working-directory: 04-using-actions/udemygithubcourse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download cached Dependencies
        if: ${{ inputs.use-cache }}
        id: cache
        uses: actions/cache@v3
        with:
          path: 04-using-actions/udemygithubcourse/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}
      - name: Building
        run: npm run build
      
    

    
  
